<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2028"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39434f"/>
      <stop offset="1" stop-color="#232a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <!-- floor grid -->
  <g stroke="#2e3944" stroke-width="2" opacity="0.6">
    <path d="M0 700 H1536"/>
    <path d="M0 800 H1536"/>
    <path d="M0 920 H1536"/>
    <path d="M200 700 L60 1024"/><path d="M500 700 L440 1024"/><path d="M900 700 L960 1024"/><path d="M1300 700 L1470 1024"/>
  </g>
  <!-- server racks, isometric-ish -->
  <g>
    <rect x="240" y="330" width="200" height="380" rx="10" fill="url(#rack)" stroke="#4a5563" stroke-width="3"/>
    <rect x="520" y="290" width="220" height="420" rx="10" fill="url(#rack)" stroke="#4a5563" stroke-width="3"/>
    <rect x="840" y="330" width="200" height="380" rx="10" fill="url(#rack)" stroke="#4a5563" stroke-width="3"/>
    <rect x="1120" y="290" width="220" height="420" rx="10" fill="url(#rack)" stroke="#4a5563" stroke-width="3"/>
  </g>
  <!-- rack LEDs -->
  <g fill="#5eead4" opacity="0.9">
    <circle cx="270" cy="360" r="5"/><circle cx="270" cy="390" r="5"/><circle cx="270" cy="420" r="5"/>
    <circle cx="550" cy="320" r="5"/><circle cx="550" cy="350" r="5"/><circle cx="550" cy="380" r="5"/>
    <circle cx="870" cy="360" r="5"/><circle cx="870" cy="390" r="5"/><circle cx="870" cy="420" r="5"/>
    <circle cx="1150" cy="320" r="5"/><circle cx="1150" cy="350" r="5"/><circle cx="1150" cy="380" r="5"/>
  </g>
  <!-- red status lights -->
  <g fill="#e63946">
    <circle cx="400" cy="360" r="7"/><circle cx="700" cy="320" r="7"/><circle cx="1000" cy="360" r="7"/><circle cx="1300" cy="320" r="7"/>
  </g>
  <!-- falling patches (bandage cards) -->
  <g>
    <g transform="translate(420,120) rotate(-8)">
      <rect x="0" y="0" width="90" height="56" rx="10" fill="#f1f5f9" opacity="0.95"/>
      <rect x="38" y="10" width="14" height="36" rx="3" fill="#94a3b8"/>
      <rect x="10" y="24" width="70" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g transform="translate(760,60) rotate(6)">
      <rect x="0" y="0" width="90" height="56" rx="10" fill="#f1f5f9" opacity="0.95"/>
      <rect x="38" y="10" width="14" height="36" rx="3" fill="#94a3b8"/>
      <rect x="10" y="24" width="70" height="8" rx="4" fill="#cbd5e1"/>
    </g>
    <g transform="translate(1090,140) rotate(-5)">
      <rect x="0" y="0" width="90" height="56" rx="10" fill="#f1f5f9" opacity="0.95"/>
      <rect x="38" y="10" width="14" height="36" rx="3" fill="#94a3b8"/>
      <rect x="10" y="24" width="70" height="8" rx="4" fill="#cbd5e1"/>
    </g>
  </g>
  <!-- padlocks -->
  <g>
    <g transform="translate(300,560) scale(1.6)">
      <circle cx="0" cy="0" r="60" fill="url(#glow)"/>
      <rect x="-20" y="-6" width="40" height="32" rx="6" fill="#e63946"/>
      <path d="M-13 -6 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#e63946" stroke-width="6"/>
      <circle cx="0" cy="8" r="4" fill="#7f1d1d"/>
    </g>
    <g transform="translate(940,590) scale(1.6)">
      <circle cx="0" cy="0" r="60" fill="url(#glow)"/>
      <rect x="-20" y="-6" width="40" height="32" rx="6" fill="#e63946"/>
      <path d="M-13 -6 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#e63946" stroke-width="6"/>
      <circle cx="0" cy="8" r="4" fill="#7f1d1d"/>
    </g>
    <g transform="translate(1230,620) scale(1.3)">
      <circle cx="0" cy="0" r="60" fill="url(#glow)"/>
      <rect x="-20" y="-6" width="40" height="32" rx="6" fill="#e63946"/>
      <path d="M-13 -6 v-10 a13 13 0 0 1 26 0 v10" fill="none" stroke="#e63946" stroke-width="6"/>
      <circle cx="0" cy="8" r="4" fill="#7f1d1d"/>
    </g>
  </g>
</svg>
