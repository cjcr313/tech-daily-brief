<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#14234a"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2745"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#4285F4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>

  <!-- skyline silhouette -->
  <g fill="#0e1730">
    <rect x="80" y="700" width="90" height="324"/>
    <rect x="190" y="600" width="70" height="424"/>
    <rect x="280" y="660" width="100" height="364"/>
    <rect x="1180" y="640" width="80" height="384"/>
    <rect x="1280" y="700" width="90" height="324"/>
    <rect x="1390" y="560" width="70" height="464"/>
  </g>
  <!-- window lights -->
  <g fill="#fbbc05" opacity="0.5">
    <rect x="205" y="620" width="8" height="10"/><rect x="225" y="660" width="8" height="10"/><rect x="205" y="720" width="8" height="10"/>
    <rect x="300" y="700" width="8" height="10"/><rect x="330" y="760" width="8" height="10"/><rect x="300" y="820" width="8" height="10"/>
    <rect x="1200" y="680" width="8" height="10"/><rect x="1225" y="740" width="8" height="10"/><rect x="1200" y="800" width="8" height="10"/>
    <rect x="1410" y="600" width="8" height="10"/><rect x="1410" y="680" width="8" height="10"/>
  </g>

  <!-- central glow -->
  <circle cx="768" cy="470" r="420" fill="url(#glow)"/>

  <!-- shield (governance) behind terminal -->
  <g transform="translate(768,480)">
    <path d="M0,-260 C120,-260 200,-160 200,-20 L200,90 C200,210 120,250 0,290 C-120,250 -200,210 -200,90 L-200,-20 C-200,-160 -120,-260 0,-260 Z"
          fill="none" stroke="url(#shield)" stroke-width="14" opacity="0.55"/>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="508" y="300" width="520" height="360" rx="18" fill="url(#term)" stroke="#2a3b66" stroke-width="2"/>
    <!-- title bar -->
    <rect x="508" y="300" width="520" height="52" rx="18" fill="#0f1830"/>
    <rect x="508" y="334" width="520" height="18" fill="#0f1830"/>
    <circle cx="544" cy="326" r="9" fill="#EA4335"/>
    <circle cx="574" cy="326" r="9" fill="#FBBC05"/>
    <circle cx="604" cy="326" r="9" fill="#34A853"/>
    <!-- code lines -->
    <g stroke-linecap="round" opacity="0.9">
      <rect x="536" y="382" width="180" height="16" rx="8" fill="#4285F4"/>
      <rect x="536" y="418" width="120" height="16" rx="8" fill="#7c3aed"/>
      <rect x="676" y="418" width="90" height="16" rx="8" fill="#34A853"/>
      <rect x="560" y="454" width="220" height="16" rx="8" fill="#3b4a75"/>
      <rect x="536" y="490" width="150" height="16" rx="8" fill="#3b4a75"/>
      <rect x="706" y="490" width="110" height="16" rx="8" fill="#FBBC05"/>
      <rect x="560" y="526" width="260" height="16" rx="8" fill="#3b4a75"/>
      <rect x="536" y="562" width="90" height="16" rx="8" fill="#EA4335"/>
      <rect x="646" y="562" width="180" height="16" rx="8" fill="#3b4a75"/>
      <rect x="560" y="598" width="200" height="16" rx="8" fill="#3b4a75"/>
    </g>
    <!-- blinking cursor -->
    <rect x="536" y="618" width="14" height="22" rx="3" fill="#4285F4"/>
  </g>

  <!-- floating agent orbs -->
  <g>
    <circle cx="360" cy="360" r="14" fill="#4285F4" opacity="0.85"/>
    <circle cx="360" cy="360" r="26" fill="none" stroke="#4285F4" stroke-width="2" opacity="0.4"/>
    <circle cx="1180" cy="330" r="12" fill="#34A853" opacity="0.85"/>
    <circle cx="1180" cy="330" r="22" fill="none" stroke="#34A853" stroke-width="2" opacity="0.4"/>
    <circle cx="330" cy="610" r="10" fill="#EA4335" opacity="0.8"/>
    <circle cx="1210" cy="600" r="10" fill="#FBBC05" opacity="0.8"/>
  </g>
</svg>
