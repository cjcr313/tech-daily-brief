<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#10293f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a55"/>
      <stop offset="1" stop-color="#132b41"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="380" cy="240" r="330" fill="url(#glowT)"/>
  <circle cx="1180" cy="800" r="360" fill="url(#glowO)"/>

  <!-- flow lines connecting devices -->
  <path d="M330,430 C560,320 820,330 1010,420" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.85"/>
  <path d="M420,700 C700,760 940,760 1120,640" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.6"/>

  <!-- desktop monitor -->
  <g transform="translate(950,300)">
    <rect x="-18" y="-14" width="436" height="16" rx="8" fill="#0d1f31"/>
    <rect x="60" y="0" width="280" height="14" rx="7" fill="#0d1f31"/>
    <rect x="0" y="-250" width="400" height="250" rx="14" fill="#0d1f31"/>
    <rect x="12" y="-238" width="376" height="226" rx="8" fill="url(#screen)"/>
    <rect x="40" y="-205" width="150" height="12" rx="6" fill="#2dd4bf" opacity="0.5"/>
    <rect x="40" y="-175" width="250" height="9" rx="4" fill="#7dd3fc" opacity="0.35"/>
    <rect x="40" y="-152" width="200" height="9" rx="4" fill="#7dd3fc" opacity="0.25"/>
    <rect x="40" y="-110" width="120" height="34" rx="8" fill="#f97316" opacity="0.85"/>
    <rect x="180" y="-110" width="120" height="34" rx="8" fill="#1e4976"/>
    <!-- click marker -->
    <circle cx="230" cy="-55" r="17" fill="none" stroke="#f97316" stroke-width="3"/>
    <circle cx="230" cy="-55" r="5" fill="#f97316"/>
  </g>

  <!-- laptop -->
  <g transform="translate(120,430)">
    <rect x="0" y="-170" width="330" height="200" rx="12" fill="#0d1f31"/>
    <rect x="12" y="-158" width="306" height="176" rx="8" fill="url(#screen)"/>
    <rect x="-22" y="30" width="374" height="16" rx="8" fill="#0d1f31"/>
    <rect x="36" y="-128" width="130" height="11" rx="5" fill="#2dd4bf" opacity="0.5"/>
    <rect x="36" y="-104" width="210" height="8" rx="4" fill="#7dd3fc" opacity="0.3"/>
    <rect x="36" y="-84" width="160" height="8" rx="4" fill="#7dd3fc" opacity="0.22"/>
    <circle cx="230" cy="-40" r="14" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="230" cy="-40" r="4" fill="#2dd4bf"/>
  </g>

  <!-- phone -->
  <g transform="translate(600,620)">
    <rect x="0" y="0" width="170" height="300" rx="24" fill="#0d1f31"/>
    <rect x="10" y="14" width="150" height="272" rx="16" fill="url(#screen)"/>
    <rect x="34" y="40" width="100" height="11" rx="5" fill="#2dd4bf" opacity="0.5"/>
    <rect x="34" y="66" width="120" height="8" rx="4" fill="#7dd3fc" opacity="0.3"/>
    <rect x="34" y="100" width="56" height="56" rx="10" fill="#1e4976"/>
    <rect x="100" y="100" width="56" height="56" rx="10" fill="#f97316" opacity="0.8"/>
    <rect x="34" y="170" width="122" height="8" rx="4" fill="#7dd3fc" opacity="0.22"/>
    <circle cx="95" cy="230" r="13" fill="none" stroke="#f97316" stroke-width="3"/>
    <circle cx="95" cy="230" r="4" fill="#f97316"/>
  </g>

  <!-- robotic cursor -->
  <g transform="translate(760,360) rotate(-8)">
    <path d="M0,0 L0,86 L20,68 L34,102 L54,92 L40,60 L66,58 Z" fill="#e2e8f0" stroke="#0a1626" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="620" cy="0" r="0" fill="none"/>
    <circle cx="-14" cy="-14" r="46" fill="none" stroke="#f97316" stroke-width="3" opacity="0.8">
      <animate attributeName="r" values="20;52;20" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- step markers along flow -->
  <g>
    <circle cx="560" cy="352" r="7" fill="#2dd4bf"/>
    <circle cx="760" cy="356" r="7" fill="#38bdf8"/>
    <circle cx="900" cy="382" r="7" fill="#f97316"/>
    <circle cx="600" cy="726" r="6" fill="#2dd4bf" opacity="0.8"/>
    <circle cx="840" cy="748" r="6" fill="#38bdf8" opacity="0.8"/>
    <circle cx="1020" cy="702" r="6" fill="#f97316" opacity="0.8"/>
  </g>

  <!-- ambient dots -->
  <g fill="#7dd3fc" opacity="0.5">
    <circle cx="120" cy="180" r="3"/>
    <circle cx="1420" cy="160" r="4"/>
    <circle cx="1360" cy="460" r="3"/>
    <circle cx="220" cy="900" r="3"/>
    <circle cx="980" cy="920" r="4"/>
    <circle cx="1480" cy="760" r="3"/>
  </g>
</svg>
