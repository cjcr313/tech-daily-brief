<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160e06"/>
      <stop offset="1" stop-color="#22150a"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#fb923c" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="768" cy="512" r="380" fill="url(#glow)"/>

  <!-- terminal window -->
  <rect x="470" y="330" width="596" height="420" rx="18" fill="#1c1208" stroke="url(#term)" stroke-width="5"/>
  <rect x="470" y="330" width="596" height="46" rx="18" fill="#2a1b0c"/>
  <rect x="470" y="352" width="596" height="24" fill="#2a1b0c"/>
  <circle cx="510" cy="353" r="8" fill="#f87171"/>
  <circle cx="540" cy="353" r="8" fill="#fbbf24"/>
  <circle cx="570" cy="353" r="8" fill="#34d399"/>

  <!-- code lines -->
  <g fill="none" stroke-linecap="round">
    <rect x="512" y="410" width="150" height="14" rx="7" fill="#f97316"/>
    <rect x="512" y="444" width="260" height="14" rx="7" fill="#38bdf8" opacity="0.8"/>
    <rect x="512" y="478" width="210" height="14" rx="7" fill="#38bdf8" opacity="0.6"/>
    <rect x="512" y="512" width="300" height="14" rx="7" fill="#fbbf24" opacity="0.75"/>
    <rect x="512" y="546" width="180" height="14" rx="7" fill="#38bdf8" opacity="0.6"/>
    <rect x="512" y="580" width="250" height="14" rx="7" fill="#38bdf8" opacity="0.8"/>
    <rect x="512" y="614" width="140" height="14" rx="7" fill="#f97316"/>
  </g>

  <!-- cursor -->
  <rect x="700" y="614" width="12" height="16" rx="3" fill="#fbbf24"/>

  <!-- agent head (glasses) -->
  <g transform="translate(768 150)">
    <circle cx="0" cy="0" r="80" fill="#1c1208" stroke="url(#blue)" stroke-width="5"/>
    <g fill="#0ea5e9" stroke="#1c1208" stroke-width="4">
      <rect x="-70" y="-14" width="60" height="40" rx="10"/>
      <rect x="10" y="-14" width="60" height="40" rx="10"/>
    </g>
    <path d="M-10 -6 h20 M-40 0 a40 14 0 0 1 80 0" stroke="#0ea5e9" stroke-width="4" fill="none"/>
    <path d="M-70 -14 v-12 M-10 -14 v-12 M10 -14 v-12 M70 -14 v-12" stroke="#0ea5e9" stroke-width="4"/>
  </g>

  <!-- orbiting data nodes -->
  <g fill="#38bdf8">
    <circle cx="300" cy="250" r="8"/><circle cx="1236" cy="250" r="8"/>
    <circle cx="280" cy="760" r="8"/><circle cx="1256" cy="760" r="8"/>
  </g>
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.7">
    <path d="M300 250 L470 420"/>
    <path d="M1236 250 L1066 420"/>
    <path d="M280 760 L470 620"/>
    <path d="M1256 760 L1066 620"/>
  </g>
</svg>
