<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#122741"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="1150" cy="780" r="320" fill="url(#glowA)"/>
  <circle cx="360" cy="260" r="300" fill="url(#glowB)"/>

  <!-- token stream: falling dots along curve -->
  <g fill="#2dd4bf">
    <circle cx="300" cy="180" r="8" fill-opacity="0.9"/>
    <circle cx="420" cy="240" r="6" fill-opacity="0.7"/>
    <circle cx="520" cy="310" r="9" fill-opacity="0.85"/>
    <circle cx="610" cy="390" r="6" fill-opacity="0.6"/>
    <circle cx="700" cy="470" r="8" fill-opacity="0.8"/>
    <circle cx="780" cy="545" r="5" fill-opacity="0.55"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="360" cy="330" r="5" fill-opacity="0.6"/>
    <circle cx="560" cy="440" r="6" fill-opacity="0.7"/>
    <circle cx="660" cy="560" r="5" fill-opacity="0.5"/>
  </g>

  <!-- descending stepped arrow -->
  <g fill="none" stroke="url(#arrow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280,260 L520,500 L520,640 L820,940"/>
  </g>
  <path d="M820,940 L742,916 L766,850 L846,872 Z" fill="#22d3ee"/>

  <!-- falling price tags -->
  <g stroke-linejoin="round">
    <g transform="translate(880 300) rotate(-14)">
      <path d="M0,0 L120,0 A18,18 0 0 1 138,18 L138,72 A18,18 0 0 1 120,90 L0,90 Z" fill="#fb923c" fill-opacity="0.9"/>
      <path d="M138,0 L196,58 L138,90 Z" fill="#f59e0b"/>
      <circle cx="164" cy="46" r="9" fill="#0a1428"/>
    </g>
    <g transform="translate(1080 470) rotate(10)">
      <path d="M0,0 L110,0 A16,16 0 0 1 126,16 L126,66 A16,16 0 0 1 110,82 L0,82 Z" fill="#f59e0b" fill-opacity="0.85"/>
      <path d="M126,0 L178,52 L126,82 Z" fill="#fb923c"/>
      <circle cx="149" cy="42" r="8" fill="#0a1428"/>
    </g>
    <g transform="translate(950 640) rotate(-8)">
      <path d="M0,0 L96,0 A14,14 0 0 1 110,14 L110,58 A14,14 0 0 1 96,72 L0,72 Z" fill="#fbbf24" fill-opacity="0.75"/>
      <path d="M110,0 L156,46 L110,72 Z" fill="#f59e0b"/>
      <circle cx="130" cy="37" r="7" fill="#0a1428"/>
    </g>
    <g transform="translate(1180 200) rotate(18)">
      <path d="M0,0 L84,0 A12,12 0 0 1 96,12 L96,50 A12,12 0 0 1 84,62 L0,62 Z" fill="#fb923c" fill-opacity="0.65"/>
      <path d="M96,0 L136,40 L96,62 Z" fill="#f59e0b"/>
      <circle cx="113" cy="32" r="6" fill="#0a1428"/>
    </g>
  </g>

  <!-- dashed reference line (old price) -->
  <path d="M280,260 L820,800" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="16 20" fill="none"/>

  <!-- circuit corner accents -->
  <g stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2.5" fill="none">
    <path d="M120,120 L120,240 L200,240"/>
    <path d="M1416,904 L1416,784 L1336,784"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="200" cy="240" r="6"/>
    <circle cx="1336" cy="784" r="6"/>
  </g>
</svg>
