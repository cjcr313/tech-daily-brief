<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1c33"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef7"/>
      <stop offset="1" stop-color="#9fb2c8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#ff5c33" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16283f"/>
      <stop offset="1" stop-color="#0e1b2e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#cfe3ff" opacity="0.55">
    <circle cx="120" cy="90" r="2"/><circle cx="300" cy="150" r="1.5"/><circle cx="520" cy="60" r="1.8"/>
    <circle cx="760" cy="110" r="1.4"/><circle cx="1010" cy="70" r="2"/><circle cx="1240" cy="140" r="1.6"/>
    <circle cx="1430" cy="60" r="2"/><circle cx="180" cy="260" r="1.4"/><circle cx="1380" cy="300" r="1.6"/>
    <circle cx="1480" cy="480" r="1.4"/><circle cx="90" cy="520" r="1.8"/>
  </g>

  <!-- GPU constellation bottom -->
  <g stroke="#3d5a80" stroke-width="1.6" opacity="0.85">
    <line x1="180" y1="760" x2="420" y2="700"/>
    <line x1="420" y1="700" x2="680" y2="780"/>
    <line x1="680" y1="780" x2="940" y2="720"/>
    <line x1="940" y1="720" x2="1180" y2="790"/>
    <line x1="1180" y1="790" x2="1420" y2="730"/>
    <line x1="420" y1="700" x2="640" y2="620"/>
    <line x1="640" y1="620" x2="940" y2="720"/>
    <line x1="940" y1="720" x2="1120" y2="640"/>
    <line x1="680" y1="780" x2="640" y2="620"/>
    <line x1="1180" y1="790" x2="1120" y2="640"/>
  </g>
  <g filter="url(#glow)">
    <g fill="#5aa9e6">
      <!-- GPU chips: rects with pins -->
      <g transform="translate(180 760)">
        <rect x="-34" y="-26" width="68" height="52" rx="8" fill="#1b3a5c" stroke="#5aa9e6" stroke-width="2.5"/>
        <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#2e6da4"/>
        <circle cx="0" cy="0" r="4" fill="#9bc4ec"/>
      </g>
      <g transform="translate(420 700)">
        <rect x="-34" y="-26" width="68" height="52" rx="8" fill="#1b3a5c" stroke="#5aa9e6" stroke-width="2.5"/>
        <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#2e6da4"/>
        <circle cx="0" cy="0" r="4" fill="#9bc4ec"/>
      </g>
      <g transform="translate(680 780)">
        <rect x="-34" y="-26" width="68" height="52" rx="8" fill="#1b3a5c" stroke="#5aa9e6" stroke-width="2.5"/>
        <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#2e6da4"/>
        <circle cx="0" cy="0" r="4" fill="#9bc4ec"/>
      </g>
      <g transform="translate(940 720)">
        <rect x="-34" y="-26" width="68" height="52" rx="8" fill="#1b3a5c" stroke="#5aa9e6" stroke-width="2.5"/>
        <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#2e6da4"/>
        <circle cx="0" cy="0" r="4" fill="#9bc4ec"/>
      </g>
      <g transform="translate(1180 790)">
        <rect x="-34" y="-26" width="68" height="52" rx="8" fill="#1b3a5c" stroke="#5aa9e6" stroke-width="2.5"/>
        <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#2e6da4"/>
        <circle cx="0" cy="0" r="4" fill="#9bc4ec"/>
      </g>
      <g transform="translate(1420 730)">
        <rect x="-34" y="-26" width="68" height="52" rx="8" fill="#1b3a5c" stroke="#5aa9e6" stroke-width="2.5"/>
        <rect x="-20" y="-14" width="40" height="28" rx="4" fill="#2e6da4"/>
        <circle cx="0" cy="0" r="4" fill="#9bc4ec"/>
      </g>
    </g>
  </g>

  <!-- rocket ascending (center-right) -->
  <g transform="translate(880 330) rotate(18)" filter="url(#softglow)">
    <!-- exhaust -->
    <polygon points="0,150 -26,60 0,-10 26,60" fill="url(#flame)"/>
    <polygon points="0,120 -14,58 0,0 14,58" fill="#ffd166" opacity="0.9"/>
    <!-- body -->
    <path d="M -52 120 Q -52 -60 0 -170 Q 52 -60 52 120 Z" fill="url(#rocket)" stroke="#c7d6e8" stroke-width="3"/>
    <!-- window -->
    <circle cx="0" cy="-20" r="26" fill="#0e1b2e" stroke="#5aa9e6" stroke-width="5"/>
    <circle cx="-8" cy="-28" r="8" fill="#9bc4ec" opacity="0.8"/>
    <!-- fins -->
    <path d="M -52 60 Q -96 96 -88 150 L -52 120 Z" fill="#ff8c42"/>
    <path d="M 52 60 Q 96 96 88 150 L 52 120 Z" fill="#ff8c42"/>
  </g>

  <!-- code editor being absorbed (left) -->
  <g transform="translate(390 300)">
    <rect x="0" y="0" width="420" height="290" rx="14" fill="url(#editor)" stroke="#5aa9e6" stroke-width="3" filter="url(#glow)"/>
    <rect x="0" y="0" width="420" height="46" rx="14" fill="#1c3352"/>
    <rect x="0" y="32" width="420" height="14" fill="#1c3352"/>
    <circle cx="28" cy="23" r="7" fill="#ff6b6b"/>
    <circle cx="52" cy="23" r="7" fill="#ffd166"/>
    <circle cx="76" cy="23" r="7" fill="#7bd88f"/>
    <!-- code lines -->
    <g stroke-linecap="round" stroke-width="10" fill="none">
      <line x1="34" y1="92" x2="150" y2="92" stroke="#7bd88f" opacity="0.9"/>
      <line x1="66" y1="124" x2="240" y2="124" stroke="#5aa9e6" opacity="0.85"/>
      <line x1="66" y1="156" x2="200" y2="156" stroke="#c792ea" opacity="0.8"/>
      <line x1="34" y1="188" x2="300" y2="188" stroke="#82aaff" opacity="0.8"/>
      <line x1="66" y1="220" x2="180" y2="220" stroke="#ffcb6b" opacity="0.75"/>
    </g>
    <!-- cursor -->
    <rect x="196" y="212" width="10" height="22" fill="#ffffff" opacity="0.95"/>
    <!-- particles flowing from editor toward rocket -->
    <g fill="#9bc4ec" opacity="0.85">
      <circle cx="450" cy="120" r="4"/>
      <circle cx="492" cy="160" r="3"/>
      <circle cx="530" cy="200" r="5"/>
      <circle cx="470" cy="240" r="3"/>
      <circle cx="560" cy="150" r="3"/>
    </g>
  </g>

  <!-- orbit ring hint -->
  <ellipse cx="800" cy="470" rx="620" ry="330" fill="none" stroke="#3d5a80" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.5"/>
</svg>
