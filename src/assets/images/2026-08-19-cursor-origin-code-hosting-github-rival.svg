<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1c33"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12263f"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#4c9f70"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cbf"/>
      <stop offset="1" stop-color="#2b6cb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c9f70" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4c9f70" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="200" r="320" fill="url(#glow)"/>

  <!-- blueprint grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.5">
    <path d="M0 120 H1600 M0 240 H1600 M0 360 H1600 M0 480 H1600 M0 600 H1600 M0 720 H1600 M0 840 H1600"/>
    <path d="M160 0 V900 M320 0 V900 M480 0 V900 M640 0 V900 M800 0 V900 M960 0 V900 M1120 0 V900 M1280 0 V900 M1440 0 V900"/>
  </g>

  <!-- background server vault, flickering -->
  <g opacity="0.85">
    <rect x="1180" y="140" width="300" height="420" rx="14" fill="#0a1626" stroke="#1e3a5f" stroke-width="3"/>
    <g fill="#ff8c42">
      <rect x="1210" y="180" width="60" height="12" rx="6" opacity="0.9"/>
      <rect x="1210" y="212" width="60" height="12" rx="6" opacity="0.35"/>
      <rect x="1210" y="244" width="60" height="12" rx="6" opacity="0.8"/>
      <rect x="1210" y="276" width="60" height="12" rx="6" opacity="0.2"/>
      <rect x="1210" y="308" width="60" height="12" rx="6" opacity="0.7"/>
      <rect x="1210" y="340" width="60" height="12" rx="6" opacity="0.15"/>
    </g>
    <g fill="#2b6cb0">
      <rect x="1300" y="180" width="60" height="12" rx="6" opacity="0.8"/>
      <rect x="1300" y="212" width="60" height="12" rx="6" opacity="0.6"/>
      <rect x="1300" y="244" width="60" height="12" rx="6" opacity="0.1"/>
      <rect x="1300" y="276" width="60" height="12" rx="6" opacity="0.7"/>
      <rect x="1300" y="308" width="60" height="12" rx="6" opacity="0.5"/>
      <rect x="1300" y="340" width="60" height="12" rx="6" opacity="0.3"/>
    </g>
    <!-- warning zigzag over vault -->
    <path d="M1200 420 l30 -36 30 36 30 -36 30 36 30 -36 30 36" fill="none" stroke="#ffd166" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
    <rect x="1180" y="140" width="300" height="420" rx="14" fill="none" stroke="#ffd166" stroke-width="2" opacity="0.35" stroke-dasharray="14 10"/>
  </g>

  <!-- central editor window -->
  <rect x="180" y="150" width="760" height="560" rx="18" fill="url(#editor)" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="180" y="150" width="760" height="54" rx="18" fill="#0e2138"/>
  <rect x="180" y="186" width="760" height="18" fill="#0e2138"/>
  <circle cx="220" cy="177" r="9" fill="#ff5f56"/>
  <circle cx="248" cy="177" r="9" fill="#ffbd2e"/>
  <circle cx="276" cy="177" r="9" fill="#27c93f"/>

  <!-- code lines -->
  <g rx="6">
    <rect x="220" y="240" width="180" height="14" rx="7" fill="#274763"/>
    <rect x="220" y="270" width="300" height="14" rx="7" fill="#274763"/>
    <rect x="250" y="300" width="240" height="14" rx="7" fill="#274763"/>
    <rect x="250" y="330" width="330" height="14" rx="7" fill="#33627d"/>
    <rect x="220" y="360" width="140" height="14" rx="7" fill="#274763"/>
    <rect x="250" y="390" width="280" height="14" rx="7" fill="#33627d"/>
  </g>

  <!-- PR cards -->
  <g filter="url(#soft)" opacity="0.6">
    <rect x="560" y="250" width="330" height="120" rx="14" fill="#1b3a5c"/>
  </g>
  <g>
    <rect x="560" y="250" width="330" height="120" rx="14" fill="#132a44" stroke="url(#card1)" stroke-width="4"/>
    <rect x="584" y="276" width="120" height="12" rx="6" fill="#4c9f70"/>
    <rect x="584" y="300" width="220" height="10" rx="5" fill="#274763"/>
    <rect x="584" y="322" width="180" height="10" rx="5" fill="#274763"/>
    <circle cx="852" cy="298" r="18" fill="#4c9f70"/>
    <path d="M845 298 l5 6 10 -12" fill="none" stroke="#0b1c33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#soft)" opacity="0.6">
    <rect x="560" y="400" width="330" height="120" rx="14" fill="#4a3320"/>
  </g>
  <g>
    <rect x="560" y="400" width="330" height="120" rx="14" fill="#1d2f3f" stroke="url(#card2)" stroke-width="4"/>
    <rect x="584" y="426" width="120" height="12" rx="6" fill="#ff8c42"/>
    <rect x="584" y="450" width="220" height="10" rx="5" fill="#274763"/>
    <rect x="584" y="472" width="160" height="10" rx="5" fill="#274763"/>
    <circle cx="852" cy="448" r="18" fill="#ff8c42"/>
    <path d="M846 442 l12 12 M858 442 l-12 12" stroke="#0b1c33" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- agent bots on the editor -->
  <g>
    <!-- agent 1 -->
    <rect x="240" y="480" width="120" height="130" rx="18" fill="#12263f" stroke="#7c5cbf" stroke-width="4"/>
    <circle cx="282" cy="530" r="20" fill="none" stroke="#7c5cbf" stroke-width="5"/>
    <circle cx="276" cy="526" r="5" fill="#7c5cbf"/>
    <circle cx="290" cy="526" r="5" fill="#7c5cbf"/>
    <path d="M272 540 q10 8 20 0" fill="none" stroke="#7c5cbf" stroke-width="4" stroke-linecap="round"/>
    <rect x="262" y="562" width="76" height="8" rx="4" fill="#274763"/>
    <rect x="262" y="580" width="56" height="8" rx="4" fill="#274763"/>
    <!-- agent 2 -->
    <rect x="410" y="500" width="110" height="110" rx="16" fill="#12263f" stroke="#2b6cb0" stroke-width="4"/>
    <circle cx="448" cy="544" r="18" fill="none" stroke="#2b6cb0" stroke-width="5"/>
    <circle cx="443" cy="540" r="4.5" fill="#2b6cb0"/>
    <circle cx="455" cy="540" r="4.5" fill="#2b6cb0"/>
    <rect x="428" y="574" width="66" height="8" rx="4" fill="#274763"/>
    <rect x="428" y="590" width="48" height="8" rx="4" fill="#274763"/>
  </g>

  <!-- connection lines editor <-> vault -->
  <g stroke="#4c9f70" stroke-width="3" stroke-dasharray="10 8" opacity="0.7" fill="none">
    <path d="M940 320 C 1040 320, 1080 260, 1180 260"/>
    <path d="M940 420 C 1040 420, 1080 380, 1180 380"/>
    <path d="M940 520 C 1040 540, 1090 470, 1180 470"/>
  </g>
  <circle cx="1180" cy="260" r="8" fill="#4c9f70"/>
  <circle cx="1180" cy="380" r="8" fill="#4c9f70"/>
  <circle cx="1180" cy="470" r="8" fill="#4c9f70"/>

  <!-- git branch motif -->
  <g stroke="#8fb3d9" stroke-width="6" fill="none" opacity="0.9">
    <path d="M300 700 C 380 700, 380 760, 460 760"/>
    <path d="M540 760 C 620 760, 620 700, 700 700"/>
    <path d="M780 700 C 860 700, 860 760, 940 760"/>
  </g>
  <circle cx="300" cy="700" r="14" fill="#4c9f70"/>
  <circle cx="540" cy="760" r="14" fill="#ff8c42"/>
  <circle cx="780" cy="700" r="14" fill="#7c5cbf"/>

  <!-- merge arrow -->
  <path d="M180 810 H 940" stroke="#1e3a5f" stroke-width="4" opacity="0.8"/>
  <text x="800" y="798" font-family="monospace" font-size="26" fill="#8fb3d9" opacity="0.85" text-anchor="middle" letter-spacing="10">_ _ _ _ _ _ _ _</text>
</svg>
