<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3350"/>
      <stop offset="1" stop-color="#13253d"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8c42" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- grid dots -->
  <g fill="#22405f" opacity="0.5">
    <circle cx="80" cy="70" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="1060" cy="90" r="2"/>
    <circle cx="1130" cy="180" r="2"/><circle cx="60" cy="560" r="2"/><circle cx="1140" cy="520" r="2"/>
    <circle cx="980" cy="580" r="2"/><circle cx="150" cy="470" r="2"/>
  </g>

  <!-- floating dashboard panels -->
  <g>
    <rect x="700" y="80" width="380" height="180" rx="12" fill="url(#panel)" stroke="#2b4a6f" stroke-width="2"/>
    <polyline points="725,220 780,180 830,200 890,130 950,160 1010,110 1055,125" fill="none" stroke="url(#line1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1055" cy="125" r="6" fill="#ff8c42"/>
  </g>
  <g>
    <rect x="760" y="300" width="360" height="170" rx="12" fill="url(#panel)" stroke="#2b4a6f" stroke-width="2"/>
    <polyline points="785,430 840,410 895,425 950,370 1005,395 1065,350 1090,360" fill="none" stroke="url(#line2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="800" y1="340" x2="800" y2="325"/>
      <line x1="830" y1="340" x2="830" y2="315"/>
      <line x1="860" y1="340" x2="860" y2="330"/>
      <line x1="890" y1="340" x2="890" y2="310"/>
    </g>
  </g>
  <!-- trace lines connecting panels -->
  <g stroke="#ff8c42" stroke-width="2" stroke-dasharray="6 8" opacity="0.55" fill="none">
    <path d="M690 220 C 660 240, 660 300, 690 330"/>
    <path d="M640 170 C 700 120, 690 105, 745 95"/>
  </g>

  <!-- robot at terminal -->
  <ellipse cx="420" cy="560" rx="220" ry="26" fill="#0a1421"/>
  <rect x="300" y="330" width="240" height="150" rx="10" fill="url(#panel)" stroke="#2b4a6f" stroke-width="2"/>
  <rect x="312" y="342" width="216" height="126" rx="4" fill="#0d1b2e"/>
  <g stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="330" y1="362" x2="410" y2="362"/>
    <line x1="330" y1="382" x2="460" y2="382"/>
    <line x1="330" y1="402" x2="430" y2="402"/>
  </g>
  <g stroke="#ff8c42" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="330" y1="430" x2="380" y2="430"/>
    <rect x="330" y="446" width="10" height="16" fill="#ff8c42"/>
  </g>
  <rect x="540" y="430" width="16" height="130" fill="#26415f"/>
  <!-- robot head -->
  <rect x="510" y="300" width="90" height="80" rx="16" fill="#e8eef5"/>
  <rect x="524" y="322" width="62" height="26" rx="8" fill="#0b1626"/>
  <circle cx="540" cy="335" r="6" fill="#2dd4bf"/>
  <circle cx="572" cy="335" r="6" fill="#2dd4bf"/>
  <line x1="555" y1="300" x2="555" y2="282" stroke="#e8eef5" stroke-width="5"/>
  <circle cx="555" cy="276" r="7" fill="#ff8c42"/>
  <ellipse cx="420" cy="560" rx="220" ry="26" fill="url(#glow)" transform="translate(140,-260) scale(1.6,1.2)"/>
</svg>
