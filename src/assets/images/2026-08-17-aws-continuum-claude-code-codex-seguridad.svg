<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16263c"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8c42" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <g fill="#1f3450" opacity="0.6">
    <circle cx="120" cy="90" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="1090" cy="70" r="2"/>
    <circle cx="90" cy="480" r="2"/><circle cx="1120" cy="500" r="2"/><circle cx="250" cy="580" r="2"/>
  </g>

  <!-- code streams from terminals (left) -->
  <g>
    <rect x="60" y="240" width="230" height="150" rx="10" fill="#13253d" stroke="#2b4a6f" stroke-width="2"/>
    <g stroke="#5eead4" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="85" y1="270" x2="190" y2="270"/>
      <line x1="85" y1="295" x2="240" y2="295"/>
      <line x1="85" y1="320" x2="160" y2="320"/>
      <line x1="85" y1="345" x2="215" y2="345"/>
    </g>
    <g stroke="#ff8c42" stroke-width="4" stroke-linecap="round">
      <line x1="85" y1="370" x2="130" y2="370"/>
    </g>
  </g>
  <!-- cloud servers (right) -->
  <g>
    <rect x="920" y="230" width="220" height="46" rx="8" fill="#13253d" stroke="#2b4a6f" stroke-width="2"/>
    <rect x="920" y="292" width="220" height="46" rx="8" fill="#13253d" stroke="#2b4a6f" stroke-width="2"/>
    <rect x="920" y="354" width="220" height="46" rx="8" fill="#13253d" stroke="#2b4a6f" stroke-width="2"/>
    <g fill="#2dd4bf">
      <circle cx="945" cy="253" r="5"/><circle cx="945" cy="315" r="5"/><circle cx="945" cy="377" r="5"/>
    </g>
    <g fill="#2b4a6f">
      <rect x="965" y="248" width="120" height="10" rx="3"/>
      <rect x="965" y="310" width="150" height="10" rx="3"/>
      <rect x="965" y="372" width="100" height="10" rx="3"/>
    </g>
  </g>

  <!-- flowing code packets -->
  <g stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.75" stroke-dasharray="2 10" stroke-linecap="round">
    <path d="M290 280 C 420 220, 520 200, 620 240"/>
    <path d="M290 320 C 440 320, 520 300, 610 310"/>
    <path d="M920 300 C 820 260, 720 250, 640 290"/>
    <path d="M920 350 C 820 340, 740 330, 650 330"/>
  </g>

  <!-- big shield center -->
  <circle cx="600" cy="315" r="240" fill="url(#shieldGlow)"/>
  <path d="M600 160 L690 195 V300 C690 390, 655 445, 600 475 C545 445, 510 390, 510 300 V195 Z"
        fill="url(#shieldGrad)" stroke="#ffd9a8" stroke-width="4"/>
  <path d="M560 315 L590 345 L650 275" fill="none" stroke="#0b1220" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- scanning beam -->
  <g opacity="0.35">
    <rect x="520" y="150" width="160" height="340" fill="#ffb36b">
      <animate attributeName="opacity" values="0.05;0.3;0.05" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
