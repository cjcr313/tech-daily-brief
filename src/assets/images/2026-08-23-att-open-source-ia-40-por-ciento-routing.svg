<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142e"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fdba74" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#60a5fa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="380" cy="380" r="360" fill="url(#blueGlow)"/>
  <circle cx="1150" cy="420" r="340" fill="url(#amberGlow)"/>

  <!-- central router node -->
  <g transform="translate(768,512)">
    <circle r="150" fill="#0f1b3d" stroke="#60a5fa" stroke-width="4"/>
    <circle r="150" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 10" opacity="0.6"/>
    <circle r="100" fill="#13234f" stroke="#3b82f6" stroke-width="3"/>
    <!-- router arrows cross -->
    <g stroke="#93c5fd" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-58,0 H44"/>
      <path d="M0,-58 V44"/>
    </g>
    <path d="M28,-24 L52,0 L28,24" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-28,-24 L-52,0 L-28,24" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,58) scale(1,-1) translate(0,-58) translate(0,0)"/>
    <path d="M-52,0 L-28,24 M-52,0 L-28,-24" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
    <path d="M24,34 L0,58 L-24,34" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- open-source model nodes (left, blue) -->
  <g transform="translate(330,300)">
    <circle r="74" fill="#0f1b3d" stroke="#3b82f6" stroke-width="4"/>
    <path d="M0,-30 L26,-16 V12 Q26,32 0,42 Q-26,32 -26,12 V-16 Z" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <circle cx="0" cy="6" r="7" fill="#60a5fa"/>
    <rect x="-3" y="6" width="6" height="13" fill="#60a5fa"/>
  </g>
  <g transform="translate(250,600)">
    <circle r="60" fill="#0f1b3d" stroke="#3b82f6" stroke-width="4"/>
    <!-- brain-ish circuit -->
    <path d="M-22,-18 Q-30,0 -18,16 Q0,28 18,16 Q30,0 22,-18 Q0,-30 -22,-18 Z" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <circle cx="-8" cy="-4" r="4" fill="#60a5fa"/>
    <circle cx="9" cy="6" r="4" fill="#60a5fa"/>
    <path d="M-8,-4 L9,6" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <g transform="translate(430,790)">
    <circle r="54" fill="#0f1b3d" stroke="#3b82f6" stroke-width="4"/>
    <!-- code brackets -->
    <path d="M-14,-16 L-28,0 L-14,16 M14,-16 L28,0 L14,16" stroke="#60a5fa" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- closed vendor nodes (right, amber) -->
  <g transform="translate(1200,320)">
    <circle r="70" fill="#2a1a10" stroke="#fb923c" stroke-width="4"/>
    <rect x="-26" y="-22" width="52" height="44" rx="8" fill="none" stroke="#fdba74" stroke-width="5"/>
    <path d="M-26,-22 a26,26 0 0 1 52,0" fill="none" stroke="#fdba74" stroke-width="5"/>
    <circle cx="0" cy="0" r="7" fill="#fdba74"/>
    <rect x="-3" y="0" width="6" height="15" fill="#fdba74"/>
  </g>
  <g transform="translate(1290,600)">
    <circle r="58" fill="#2a1a10" stroke="#fb923c" stroke-width="4"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#fdba74" stroke-width="5"/>
    <path d="M0,-38 L10,-22 H-10 Z" fill="#fdba74"/>
    <rect x="34" y="-4" width="18" height="8" rx="4" fill="#fdba74"/>
    <rect x="-52" y="-4" width="18" height="8" rx="4" fill="#fdba74"/>
  </g>

  <!-- telecom tower -->
  <g transform="translate(1080,820)" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M0,120 L-34,-90 M0,120 L34,-90"/>
    <path d="M-24,40 H24 M-16,-8 H16 M-8,-54 H8"/>
    <circle cx="0" cy="-104" r="10" fill="#fb923c" stroke="none"/>
    <path d="M-26,-118 a30,30 0 0 1 52,0 M-38,-136 a46,46 0 0 1 76,0" stroke="#fb923c" stroke-width="5" opacity="0.7"/>
  </g>

  <!-- routing beams -->
  <rect x="430" y="300" width="230" height="8" rx="4" fill="url(#beamB)" transform="rotate(14 430 300)"/>
  <rect x="330" y="600" width="300" height="6" rx="3" fill="url(#beamB)" transform="rotate(-16 330 600)"/>
  <rect x="500" y="780" width="220" height="6" rx="3" fill="url(#beamB)" transform="rotate(-32 500 780)"/>
  <rect x="900" y="330" width="230" height="8" rx="4" fill="url(#beamA)" transform="rotate(-12 900 330)"/>
  <rect x="900" y="570" width="280" height="6" rx="3" fill="url(#beamA)" transform="rotate(14 900 570)"/>
  <rect x="880" y="700" width="180" height="5" rx="2.5" fill="url(#beamA)" transform="rotate(30 880 700)" opacity="0.6"/>

  <!-- floating coins (cost) -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="620" cy="180" r="16" fill="#0f1b3d" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="660" cy="130" r="11" fill="#0f1b3d" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="920" cy="840" r="14" fill="#0f1b3d" stroke="#fbbf24" stroke-width="4"/>
  </g>
</svg>
