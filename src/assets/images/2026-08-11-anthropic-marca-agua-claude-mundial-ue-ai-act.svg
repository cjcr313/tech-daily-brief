<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001028"/>
      <stop offset="50%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000812"/>
    </linearGradient>
    <radialGradient id="brain" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000033" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1929" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ripple1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4da6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="watermark">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#brain)"/>
  <!-- AI Brain (abstract, top center) -->
  <g filter="url(#softglow)" opacity="0.6" transform="translate(512, 280)">
    <!-- Neural network nodes -->
    <g fill="#4da6ff">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="-60" cy="-40" r="5"/>
      <circle cx="60" cy="-40" r="5"/>
      <circle cx="-80" cy="20" r="5"/>
      <circle cx="80" cy="20" r="5"/>
      <circle cx="-40" cy="60" r="5"/>
      <circle cx="40" cy="60" r="5"/>
      <circle cx="0" cy="80" r="6"/>
    </g>
    <!-- Connections -->
    <g stroke="#4da6ff" stroke-width="1" opacity="0.4" fill="none">
      <line x1="0" y1="0" x2="-60" y2="-40"/>
      <line x1="0" y1="0" x2="60" y2="-40"/>
      <line x1="0" y1="0" x2="-80" y2="20"/>
      <line x1="0" y1="0" x2="80" y2="20"/>
      <line x1="0" y1="0" x2="-40" y2="60"/>
      <line x1="0" y1="0" x2="40" y2="60"/>
      <line x1="0" y1="0" x2="0" y2="80"/>
      <line x1="-60" y1="-40" x2="-80" y2="20"/>
      <line x1="60" y1="-40" x2="80" y2="20"/>
      <line x1="-80" y1="20" x2="-40" y2="60"/>
      <line x1="80" y1="20" x2="40" y2="60"/>
      <line x1="-40" y1="60" x2="0" y2="80"/>
      <line x1="40" y1="60" x2="0" y2="80"/>
    </g>
  </g>
  <!-- Watermark ripples emanating -->
  <g opacity="0.5">
    <ellipse cx="512" cy="280" rx="120" ry="40" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.4"/>
    <ellipse cx="512" cy="280" rx="180" ry="60" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <ellipse cx="512" cy="280" rx="240" ry="80" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.2"/>
    <ellipse cx="512" cy="280" rx="300" ry="100" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.1"/>
  </g>
  <!-- Documents flowing down -->
  <!-- Doc 1 (left) -->
  <g transform="translate(180, 420) rotate(-8)" filter="url(#softglow)">
    <rect width="180" height="230" rx="6" fill="url(#docGrad)" stroke="#4da6ff" stroke-width="1" opacity="0.85"/>
    <line x1="20" y1="40" x2="160" y2="40" stroke="#4da6ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="65" x2="140" y2="65" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="85" x2="155" y2="85" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="105" x2="120" y2="105" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="125" x2="145" y2="125" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="145" x2="100" y2="145" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="165" x2="135" y2="165" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <!-- Watermark fingerprint overlay -->
    <circle cx="90" cy="115" r="50" fill="none" stroke="#4da6ff" stroke-width="0.8" opacity="0.25" stroke-dasharray="3,3"/>
    <circle cx="90" cy="115" r="35" fill="none" stroke="#4da6ff" stroke-width="0.8" opacity="0.2" stroke-dasharray="2,3"/>
    <circle cx="90" cy="115" r="20" fill="none" stroke="#4da6ff" stroke-width="0.8" opacity="0.15"/>
  </g>
  <!-- Doc 2 (center) -->
  <g transform="translate(422, 450)" filter="url(#softglow)">
    <rect width="180" height="230" rx="6" fill="url(#docGrad)" stroke="#4da6ff" stroke-width="1" opacity="0.9"/>
    <line x1="20" y1="40" x2="160" y2="40" stroke="#4da6ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="65" x2="140" y2="65" stroke="#4da6ff" stroke-width="1" opacity="0.35"/>
    <line x1="20" y1="85" x2="155" y2="85" stroke="#4da6ff" stroke-width="1" opacity="0.35"/>
    <line x1="20" y1="105" x2="120" y2="105" stroke="#4da6ff" stroke-width="1" opacity="0.35"/>
    <line x1="20" y1="125" x2="145" y2="125" stroke="#4da6ff" stroke-width="1" opacity="0.35"/>
    <line x1="20" y1="145" x2="100" y2="145" stroke="#4da6ff" stroke-width="1" opacity="0.35"/>
    <line x1="20" y1="165" x2="135" y2="165" stroke="#4da6ff" stroke-width="1" opacity="0.35"/>
    <circle cx="90" cy="115" r="55" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
    <circle cx="90" cy="115" r="38" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.25" stroke-dasharray="2,3"/>
    <circle cx="90" cy="115" r="22" fill="none" stroke="#4da6ff" stroke-width="1" opacity="0.2"/>
    <text x="75" y="120" font-family="monospace" font-size="8" fill="#4da6ff" opacity="0.4">C2PA</text>
  </g>
  <!-- Doc 3 (right) -->
  <g transform="translate(664, 420) rotate(8)" filter="url(#softglow)">
    <rect width="180" height="230" rx="6" fill="url(#docGrad)" stroke="#4da6ff" stroke-width="1" opacity="0.85"/>
    <line x1="20" y1="40" x2="160" y2="40" stroke="#4da6ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="65" x2="140" y2="65" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="85" x2="155" y2="85" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="105" x2="120" y2="105" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="125" x2="145" y2="125" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="145" x2="100" y2="145" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="165" x2="135" y2="165" stroke="#4da6ff" stroke-width="1" opacity="0.3"/>
    <circle cx="90" cy="115" r="50" fill="none" stroke="#4da6ff" stroke-width="0.8" opacity="0.25" stroke-dasharray="3,3"/>
    <circle cx="90" cy="115" r="35" fill="none" stroke="#4da6ff" stroke-width="0.8" opacity="0.2" stroke-dasharray="2,3"/>
    <circle cx="90" cy="115" r="20" fill="none" stroke="#4da6ff" stroke-width="0.8" opacity="0.15"/>
  </g>
  <!-- Connection lines from brain to docs -->
  <g stroke="#4da6ff" stroke-width="1" opacity="0.2" fill="none" stroke-dasharray="4,6">
    <path d="M 420 320 Q 350 380 270 420"/>
    <path d="M 512 360 Q 512 400 512 450"/>
    <path d="M 604 320 Q 680 380 754 420"/>
  </g>
  <!-- EU stars (subtle, top) -->
  <g fill="#4da6ff" opacity="0.15">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="180" cy="60" r="2"/>
    <circle cx="260" cy="75" r="2"/>
    <circle cx="844" cy="80" r="2"/>
    <circle cx="924" cy="60" r="2"/>
  </g>
  <!-- Watermark wave at bottom -->
  <g opacity="0.3">
    <path d="M 0 900 Q 256 870 512 900 T 1024 900 L 1024 1024 L 0 1024 Z" fill="#4da6ff" opacity="0.08"/>
    <path d="M 0 920 Q 256 890 512 920 T 1024 920 L 1024 1024 L 0 1024 Z" fill="#4da6ff" opacity="0.05"/>
  </g>
</svg>
