<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="Nube de red global con nodos en alerta y cables desconectados">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="60%" stop-color="#0c1526"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9d3f"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- subtle circuit pattern -->
  <g stroke="#1d3557" stroke-width="2" fill="none" opacity="0.5">
    <path d="M0 820 H180 l40 40 H420"/>
    <path d="M1536 140 H1360 l-50 50 H1180"/>
    <path d="M0 180 H120 l60 60 H320"/>
    <path d="M1536 900 H1300 l-60 -60 H1120"/>
    <path d="M240 1024 V880 l50 -50 V760"/>
    <path d="M1290 0 V140 l40 40"/>
  </g>
  <g fill="#274b73" opacity="0.7">
    <circle cx="180" cy="820" r="6"/><circle cx="420" cy="860" r="6"/>
    <circle cx="1360" cy="140" r="6"/><circle cx="1180" cy="190" r="6"/>
    <circle cx="120" cy="180" r="6"/><circle cx="320" cy="240" r="6"/>
    <circle cx="1300" cy="900" r="6"/><circle cx="1120" cy="840" r="6"/>
    <circle cx="240" cy="880" r="5"/><circle cx="290" cy="760" r="5"/>
    <circle cx="1290" cy="140" r="5"/><circle cx="1330" cy="180" r="5"/>
  </g>

  <!-- globe -->
  <g>
    <circle cx="768" cy="700" r="290" fill="url(#globe)" stroke="#3b82c4" stroke-width="3" opacity="0.95"/>
    <g stroke="#3b82c4" stroke-width="2" fill="none" opacity="0.55">
      <ellipse cx="768" cy="700" rx="290" ry="110"/>
      <ellipse cx="768" cy="700" rx="290" ry="220"/>
      <ellipse cx="768" cy="700" rx="120" ry="290"/>
      <ellipse cx="768" cy="700" rx="230" ry="290"/>
      <line x1="478" y1="700" x2="1058" y2="700"/>
    </g>
    <!-- globe nodes -->
    <g fill="#5da2e0">
      <circle cx="640" cy="620" r="9"/><circle cx="880" cy="600" r="8"/>
      <circle cx="940" cy="760" r="9"/><circle cx="620" cy="800" r="8"/>
      <circle cx="768" cy="880" r="7"/><circle cx="560" cy="700" r="7"/>
    </g>
    <g stroke="#5da2e0" stroke-width="2" opacity="0.6">
      <line x1="640" y1="620" x2="880" y2="600"/>
      <line x1="880" y1="600" x2="940" y2="760"/>
      <line x1="940" y1="760" x2="768" y2="880"/>
      <line x1="768" y1="880" x2="620" y2="800"/>
      <line x1="620" y1="800" x2="640" y2="620"/>
      <line x1="560" y1="700" x2="640" y2="620"/>
    </g>
  </g>

  <!-- big cloud shape -->
  <g filter="url(#glow)">
    <path d="M430 520
             a120 120 0 0 1 100-190
             a150 150 0 0 1 280-60
             a130 130 0 0 1 200 40
             a110 110 0 0 1 90 180
             a95 95 0 0 1-30 150
             H520
             a110 110 0 0 1-90-120 Z"
          fill="url(#cloud)" opacity="0.97"/>
  </g>
  <!-- cloud inner nodes + links -->
  <g stroke="#7c2d12" stroke-width="3" opacity="0.85">
    <line x1="620" y1="420" x2="800" y2="380"/>
    <line x1="800" y1="380" x2="920" y2="470"/>
    <line x1="620" y1="420" x2="700" y2="540"/>
    <line x1="700" y1="540" x2="920" y2="470"/>
    <line x1="800" y1="380" x2="700" y2="540"/>
    <line x1="920" y1="470" x2="1010" y2="560"/>
    <line x1="700" y1="540" x2="560" y2="580"/>
  </g>
  <g fill="#fff7ed" filter="url(#softglow)">
    <circle cx="620" cy="420" r="12"/>
    <circle cx="800" cy="380" r="14"/>
    <circle cx="920" cy="470" r="12"/>
    <circle cx="700" cy="540" r="10"/>
    <circle cx="1010" cy="560" r="9"/>
    <circle cx="560" cy="580" r="9"/>
  </g>

  <!-- cloud-to-globe links -->
  <g stroke="#f97316" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.7">
    <line x1="640" y1="620" x2="620" y2="560" opacity="0"/>
    <path d="M620 620 Q600 560 640 560" fill="none"/>
    <path d="M880 600 Q940 540 900 520" fill="none"/>
    <path d="M940 760 Q1000 660 960 590" fill="none"/>
  </g>

  <!-- warning alerts -->
  <g>
    <g transform="translate(880 340)">
      <path d="M0 -26 L24 18 H-24 Z" fill="#facc15" stroke="#78350f" stroke-width="3" filter="url(#softglow)"/>
      <rect x="-3" y="-12" width="6" height="16" rx="3" fill="#78350f"/>
      <circle cx="0" cy="10" r="3.5" fill="#78350f"/>
    </g>
    <g transform="translate(560 470)">
      <path d="M0 -22 L20 15 H-20 Z" fill="#f87171" stroke="#450a0a" stroke-width="3" filter="url(#softglow)"/>
      <rect x="-2.5" y="-10" width="5" height="13" rx="2.5" fill="#450a0a"/>
      <circle cx="0" cy="8" r="3" fill="#450a0a"/>
    </g>
    <g transform="translate(1000 640)">
      <path d="M0 -20 L18 14 H-18 Z" fill="#facc15" stroke="#78350f" stroke-width="3" filter="url(#softglow)"/>
      <rect x="-2.5" y="-9" width="5" height="12" rx="2.5" fill="#78350f"/>
      <circle cx="0" cy="7" r="3" fill="#78350f"/>
    </g>
  </g>

  <!-- disconnected dangling cables -->
  <g fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
    <path d="M1058 520 C1140 560 1160 640 1150 720"/>
    <path d="M470 560 C400 600 380 660 396 730"/>
  </g>
  <!-- connectors -->
  <g>
    <rect x="1136" y="716" width="30" height="22" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <rect x="1152" y="738" width="10" height="16" rx="3" fill="#94a3b8"/>
    <rect x="382" y="726" width="30" height="22" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <rect x="398" y="748" width="10" height="16" rx="3" fill="#94a3b8"/>
  </g>
  <!-- spark where cable detached -->
  <g stroke="#fde047" stroke-width="3" stroke-linecap="round" filter="url(#softglow)">
    <line x1="1146" y1="706" x2="1146" y2="690"/>
    <line x1="1130" y1="712" x2="1118" y2="700"/>
    <line x1="1162" y1="712" x2="1174" y2="700"/>
  </g>

  <!-- floating data dots -->
  <g fill="#f97316" opacity="0.85">
    <circle cx="300" cy="330" r="6"/><circle cx="1250" cy="300" r="7"/>
    <circle cx="1180" cy="820" r="5"/><circle cx="360" cy="880" r="6"/>
    <circle cx="1330" cy="560" r="5"/><circle cx="220" cy="560" r="5"/>
  </g>
</svg>
