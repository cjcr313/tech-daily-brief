<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141c3a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a55"/>
      <stop offset="1" stop-color="#151d3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64,0 L0,0 0,64" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="768" cy="512" r="400" fill="url(#glow)"/>

  <!-- admin panel window -->
  <rect x="430" y="250" width="676" height="524" rx="24" fill="url(#panel)" stroke="url(#accent)" stroke-width="5"/>
  <!-- header bar -->
  <rect x="430" y="250" width="676" height="72" rx="24" fill="#0d1429"/>
  <rect x="430" y="298" width="676" height="24" fill="#0d1429"/>
  <circle cx="478" cy="286" r="12" fill="#f87171"/>
  <circle cx="516" cy="286" r="12" fill="#fbbf24"/>
  <circle cx="554" cy="286" r="12" fill="#34d399"/>
  <text x="606" y="294" font-family="monospace" font-size="26" fill="#93b4f5">Admin plugin</text>

  <!-- left column: users -->
  <circle cx="520" cy="430" r="46" fill="#1e2a55" stroke="#60a5fa" stroke-width="4"/>
  <circle cx="520" cy="418" r="16" fill="#60a5fa"/>
  <path d="M482 470 a38 38 0 0 1 76 0z" fill="#60a5fa"/>
  <circle cx="520" cy="566" r="46" fill="#1e2a55" stroke="#8b5cf6" stroke-width="4"/>
  <circle cx="520" cy="554" r="16" fill="#8b5cf6"/>
  <path d="M482 606 a38 38 0 0 1 76 0z" fill="#8b5cf6"/>

  <!-- right: bar chart -->
  <g fill="url(#accent)">
    <rect x="640" y="520" width="34" height="110" rx="6" opacity="0.55"/>
    <rect x="690" y="470" width="34" height="160" rx="6" opacity="0.7"/>
    <rect x="740" y="430" width="34" height="200" rx="6" opacity="0.85"/>
    <rect x="790" y="380" width="34" height="250" rx="6"/>
  </g>
  <!-- gear -->
  <g transform="translate(950,560)">
    <circle r="58" fill="none" stroke="#fbbf24" stroke-width="12" stroke-dasharray="14 10"/>
    <circle r="22" fill="#fbbf24"/>
  </g>
  <!-- chat bubble -->
  <path d="M680 330 h240 q18 0 18 18 v34 q0 18 -18 18 h-176 l-34 34 v-34 h-30 q-18 0 -18 -18 v-34 q0 -18 18 -18z" fill="#0d1429" stroke="#60a5fa" stroke-width="3"/>

  <circle cx="1228" cy="320" r="14" fill="#8b5cf6"/>
  <circle cx="1266" cy="350" r="10" fill="#60a5fa"/>
</svg>
