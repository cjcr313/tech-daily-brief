<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#14263f"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>
    <radialGradient id="amber" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2c48"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg2)"/>

  <!-- floor -->
  <rect y="760" width="1536" height="264" fill="#0a1322"/>
  <g stroke="#16263e" stroke-width="2">
    <line x1="0" y1="800" x2="1536" y2="800"/>
    <line x1="0" y1="860" x2="1536" y2="860"/>
    <line x1="0" y1="930" x2="1536" y2="930"/>
  </g>

  <!-- frozen training streams -->
  <g stroke="url(#stream)" stroke-width="5" fill="none" filter="url(#softglow)">
    <path d="M100 300 C 400 260, 640 300, 768 380"/>
    <path d="M200 220 C 460 200, 640 250, 768 360"/>
    <path d="M1436 300 C 1136 260, 896 300, 768 380"/>
    <path d="M1336 220 C 1076 200, 896 250, 768 360"/>
  </g>
  <!-- freeze particles -->
  <g fill="#fde68a" opacity="0.9">
    <circle cx="430" cy="272" r="5"/><circle cx="600" cy="310" r="4"/><circle cx="520" cy="235" r="4"/>
    <circle cx="1106" cy="272" r="5"/><circle cx="936" cy="310" r="4"/><circle cx="1016" cy="235" r="4"/>
  </g>

  <!-- giant pause button -->
  <g filter="url(#softglow)">
    <circle cx="768" cy="420" r="150" fill="url(#amber)" opacity="0.97"/>
    <circle cx="768" cy="420" r="150" fill="none" stroke="#fde68a" stroke-width="5" opacity="0.8"/>
    <circle cx="768" cy="420" r="185" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.45" stroke-dasharray="14 16"/>
  </g>
  <rect x="718" y="352" width="38" height="136" rx="9" fill="#1a1206"/>
  <rect x="780" y="352" width="38" height="136" rx="9" fill="#1a1206"/>

  <!-- light beam from button to floor -->
  <path d="M768 570 L700 760 L836 760 Z" fill="#f59e0b" opacity="0.14"/>

  <!-- server racks -->
  <g>
    <!-- rack 1 -->
    <rect x="200" y="560" width="150" height="200" rx="8" fill="url(#rack)" stroke="#2c4269" stroke-width="2.5"/>
    <g fill="#38bdf8">
      <rect x="220" y="584" width="60" height="7" rx="3.5" opacity="0.85"/>
      <rect x="220" y="616" width="60" height="7" rx="3.5" opacity="0.5"/>
      <rect x="220" y="648" width="60" height="7" rx="3.5" opacity="0.85"/>
      <rect x="220" y="680" width="60" height="7" rx="3.5" opacity="0.35"/>
      <rect x="220" y="712" width="60" height="7" rx="3.5" opacity="0.85"/>
    </g>
    <g fill="#f59e0b">
      <circle cx="316" cy="587" r="6" opacity="0.9"/><circle cx="316" cy="619" r="6" opacity="0.4"/>
      <circle cx="316" cy="651" r="6" opacity="0.9"/><circle cx="316" cy="683" r="6" opacity="0.3"/>
      <circle cx="316" cy="715" r="6" opacity="0.9"/>
    </g>
    <!-- rack 2 -->
    <rect x="1180" y="560" width="150" height="200" rx="8" fill="url(#rack)" stroke="#2c4269" stroke-width="2.5"/>
    <g fill="#38bdf8">
      <rect x="1200" y="584" width="60" height="7" rx="3.5" opacity="0.6"/>
      <rect x="1200" y="616" width="60" height="7" rx="3.5" opacity="0.85"/>
      <rect x="1200" y="648" width="60" height="7" rx="3.5" opacity="0.4"/>
      <rect x="1200" y="680" width="60" height="7" rx="3.5" opacity="0.85"/>
      <rect x="1200" y="712" width="60" height="7" rx="3.5" opacity="0.55"/>
    </g>
    <g fill="#f59e0b">
      <circle cx="1296" cy="587" r="6" opacity="0.45"/><circle cx="1296" cy="619" r="6" opacity="0.9"/>
      <circle cx="1296" cy="651" r="6" opacity="0.35"/><circle cx="1296" cy="683" r="6" opacity="0.9"/>
      <circle cx="1296" cy="715" r="6" opacity="0.4"/>
    </g>
    <!-- center rack (dimmed, paused) -->
    <rect x="688" y="600" width="160" height="160" rx="8" fill="#0e1728" stroke="#22344f" stroke-width="2.5" opacity="0.95"/>
    <g fill="#334f7d">
      <rect x="708" y="622" width="60" height="7" rx="3.5"/>
      <rect x="708" y="650" width="60" height="7" rx="3.5"/>
      <rect x="708" y="678" width="60" height="7" rx="3.5"/>
      <rect x="708" y="706" width="60" height="7" rx="3.5"/>
    </g>
    <g fill="#7c5a17">
      <circle cx="804" cy="625" r="6"/><circle cx="804" cy="653" r="6"/>
      <circle cx="804" cy="681" r="6"/><circle cx="804" cy="709" r="6"/>
    </g>
  </g>

  <!-- ambient status dots floating -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="420" cy="500" r="4"/><circle cx="1120" cy="480" r="4"/>
    <circle cx="520" cy="180" r="3"/><circle cx="1020" cy="160" r="3"/>
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="330" cy="470" r="4"/><circle cx="1210" cy="510" r="4"/>
  </g>
</svg>
