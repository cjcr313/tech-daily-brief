<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d12"/>
      <stop offset="1" stop-color="#33121a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5568"/>
      <stop offset="1" stop-color="#232b3a"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <path id="swirl" d="M0,0 C60,-40 140,-40 200,0 C260,40 340,40 400,0" fill="none"/>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <ellipse cx="768" cy="380" rx="700" ry="420" fill="url(#warm)"/>

  <!-- debian-like swirls -->
  <g stroke="#d70a53" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M140,180 C220,110 320,120 380,190 C440,260 540,270 610,200" stroke-width="26"/>
    <path d="M120,260 C200,190 300,200 360,270 C420,340 520,350 590,280" stroke-width="14" opacity="0.5"/>
    <path d="M940,820 C1020,750 1120,760 1180,830 C1240,900 1340,910 1410,840" stroke-width="26" opacity="0.7"/>
    <path d="M980,890 C1060,820 1160,830 1220,900 C1280,970 1380,980 1440,910" stroke-width="14" opacity="0.4"/>
  </g>

  <!-- assembly silhouettes -->
  <g fill="#120809" opacity="0.9">
    <circle cx="120" cy="860" r="46"/><rect x="70" y="916" width="100" height="110" rx="26"/>
    <circle cx="260" cy="880" r="40"/><rect x="218" y="930" width="88" height="96" rx="22"/>
    <circle cx="1330" cy="180" r="44"/><rect x="1284" y="232" width="96" height="104" rx="24"/>
    <circle cx="1460" cy="240" r="36"/><rect x="1424" y="284" width="76" height="88" rx="20"/>
  </g>

  <!-- ballot box -->
  <g transform="translate(768,560)">
    <rect x="-230" y="-40" width="460" height="300" rx="22" fill="url(#metal)" stroke="#5b6activ" />
    <rect x="-230" y="-40" width="460" height="300" rx="22" fill="url(#metal)" stroke="#6b7a92" stroke-width="6"/>
    <rect x="-70" y="-150" width="140" height="120" rx="12" fill="#171d29" stroke="#6b7a92" stroke-width="6"/>
    <!-- slot -->
    <rect x="-190" y="-46" width="380" height="18" rx="9" fill="#0d121c"/>
    <!-- translucent body hint -->
    <rect x="-210" y="30" width="420" height="210" rx="16" fill="#0f1520" opacity="0.55"/>
    <!-- gear ballot -->
    <g transform="translate(-140,-236) rotate(-14)">
      <rect x="-72" y="-48" width="144" height="96" rx="10" fill="#f4f6fa" stroke="#c8d0dc" stroke-width="4"/>
      <g fill="#3d4a5f">
        <circle cx="0" cy="0" r="22"/>
        <g>
          <rect x="-6" y="-38" width="12" height="14" rx="3"/><rect x="-6" y="24" width="12" height="14" rx="3"/>
          <rect x="-38" y="-6" width="14" height="12" rx="3"/><rect x="24" y="-6" width="14" height="12" rx="3"/>
          <rect x="16" y="-32" width="12" height="12" rx="3" transform="rotate(45 22 -26)"/>
          <rect x="-28" y="20" width="12" height="12" rx="3" transform="rotate(45 -22 26)"/>
          <rect x="16" y="20" width="12" height="12" rx="3" transform="rotate(-45 22 26)"/>
          <rect x="-28" y="-32" width="12" height="12" rx="3" transform="rotate(-45 -22 -26)"/>
        </g>
      </g>
    </g>
    <!-- neural ballot -->
    <g transform="translate(140,-236) rotate(12)">
      <rect x="-72" y="-48" width="144" height="96" rx="10" fill="#f4f6fa" stroke="#c8d0dc" stroke-width="4"/>
      <g stroke="#1e6fd9" stroke-width="5" fill="none">
        <line x1="-34" y1="-14" x2="0" y2="-26"/><line x1="-34" y1="-14" x2="0" y2="18"/>
        <line x1="-34" y1="20" x2="0" y2="18"/><line x1="0" y1="-26" x2="34" y2="0"/>
        <line x1="0" y1="18" x2="34" y2="0"/>
      </g>
      <g fill="#1e6fd9">
        <circle cx="-34" cy="-14" r="9"/><circle cx="-34" cy="20" r="9"/>
        <circle cx="0" cy="-26" r="9"/><circle cx="0" cy="18" r="9"/><circle cx="34" cy="0" r="11"/>
      </g>
    </g>
    <!-- falling ballots -->
    <g fill="#e9edf3" opacity="0.95">
      <rect x="-40" y="-120" width="66" height="44" rx="6" transform="rotate(-8 -40 -120)"/>
      <rect x="20" y="-100" width="60" height="40" rx="6" transform="rotate(10 20 -100)"/>
    </g>
  </g>

  <!-- check / cross tokens -->
  <g transform="translate(340,300)">
    <circle r="58" fill="#123322" stroke="#3ddc84" stroke-width="6"/>
    <path d="M-24,2 L-6,22 L28,-18" fill="none" stroke="#3ddc84" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1196,300)">
    <circle r="58" fill="#33131a" stroke="#ff5d5d" stroke-width="6"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#ff5d5d" stroke-width="10" stroke-linecap="round"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#ff5d5d" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
