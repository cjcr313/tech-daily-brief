name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Reparar referencias de imagen rotas (placeholder)
        run: |
          cd src/content/posts
          for ref in $(grep -hoE '\.\./\.\./assets/images/[A-Za-z0-9._-]+\.(jpg|jpeg|png|webp|avif)' *.md | sort -u); do
            f="../../assets/images/${ref##*/}"
            [ -f "$f" ] || { echo "FIX: ${ref##*/}"; sed -i "s|$ref|../../assets/images/placeholder.jpg|g" *.md; }
          done
      - name: Cuarentena de frontmatters YAML rotos (no congelan el sitio)
        run: |
          python3 - <<'PY'
          import glob, re, sys, shutil, os
          try:
              import yaml
          except ImportError:
              sys.exit(0)
          NL = chr(10)
          qdir = '/tmp/quarantine'
          os.makedirs(qdir, exist_ok=True)
          bad = 0
          for f in sorted(glob.glob('src/content/posts/*.md')):
              txt = open(f).read()
              m = re.match('^---' + NL + '(.*?)' + NL + '---' + NL, txt, re.S)
              ok = False
              if m:
                  try:
                      yaml.safe_load(m.group(1)); ok = True
                  except Exception:
                      ok = False
              if not ok:
                  shutil.move(f, qdir)
                  bad += 1
          print(f'frontmatters en cuarentena: {bad}')
          PY
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
